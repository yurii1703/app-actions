name: Test and Build
run-name: Testing and building

on:
  pull_request:
    types: [opened, reopened]
    branches: main

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up node
        uses: actions/setup-node@v7
      - name: Init node modules
        run:  npm ci
      - name: Run lint
        run:  npm run lint 
