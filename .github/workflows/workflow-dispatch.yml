name: Manual trigger
run-name: Manually triggered

on:
  workflow_dispatch:
    inputs:
      user_name:
        description: 'What is your name ?'
        type: string
        required: true
      user_gender:
        description: 'What is your gender'
        required: true
        type: choice
        options:
          - Male
          - Female
      user_age:
        description: "How old are you?"
        required: true
        type: string
      does_sport:
        description: "Do you do sport?"
        type: boolean
        default: false

jobs:
  print_user:
    name: Display user
    runs-on: ubuntu-latest
    steps:
      - name: Show inputs
        run: echo '${{ toJSON(inputs) }}'
      - name: Show github context
        run: echo '${{ toJSON(github) }}'
      - name: Show Vars
        run: echo '${{ toJSON(vars) }}'
      - name: Show env vars
        run: echo '${{ toJSON(env) }}'
      - name: Does sport
        if: inputs.does_sport
        run: echo 'You rock!'

      
